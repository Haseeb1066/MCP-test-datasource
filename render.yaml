services:
  - type: web
    name: mcp-test
    # Node runtime (existing service). Python is available as python3 for uvicorn.
    runtime: node
    buildCommand: pip3 install -r requirements.txt && npm install && npm run build
    startCommand: python3 -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Required for nunomics.ai / private CA Tableau hosts (set also in Render dashboard if not using this file)
      - key: TABLEAU_SSL_VERIFY
        value: "0"
      - key: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0"
      # Also set in Render dashboard (secrets): TABLEAU_SERVER, TABLEAU_SITE_NAME,
      # TABLEAU_CONNECTED_APP_*, TABLEAU_JWT_SUB_CLAIM (site admin for Query Users), OPENAI_API_KEY
